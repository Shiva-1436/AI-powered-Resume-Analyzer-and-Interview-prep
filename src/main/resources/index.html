<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Resume Reviewer</title>
    <link rel="icon" type="image/x-icon" href="/static/seo.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-gray-100 min-h-screen py-10 px-4">

<div class="max-w-2xl mx-auto">

    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-indigo-600">AI Resume Reviewer</h1>
        <p class="text-gray-500 mt-2">Get honest AI feedback on your resume instantly</p>
    </div>

    <!-- Upload Card -->
    <div class="bg-white rounded-2xl shadow p-6 mb-6">
        <label class="block text-gray-700 font-semibold mb-2">Upload Your Resume (PDF)</label>
        <input type="file" id="resumeFile" accept=".pdf"
               class="block w-full border border-gray-300 rounded-xl p-3 text-gray-600">

        <label class="block text-gray-700 font-semibold mb-2 mt-4">Paste Job Description</label>
        <textarea id="jobDescription" rows="6"
                  placeholder="Paste the job description here..."
                  class="block w-full border border-gray-300 rounded-xl p-3 text-gray-600 resize-none">
        </textarea>

        <button onclick="analyzeResume()"
                class="mt-4 w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold
                       hover:bg-indigo-700 transition duration-200">
            Analyze Resume
        </button>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden text-center py-10">
        <div class="inline-block w-10 h-10 border-4 border-indigo-600
                        border-t-transparent rounded-full animate-spin"></div>
        <p class="text-gray-500 mt-3 font-medium">Analyzing your resume...</p>
    </div>

    <!-- Result Sections -->
    <div id="result" class="hidden space-y-4">

        <!-- JD Match Score -->
        <div class="bg-indigo-600 rounded-2xl shadow p-6 text-center">
            <h2 class="text-lg font-bold text-white mb-2">JD Match Score</h2>
            <div id="overallScore" class="text-5xl font-bold text-white"></div>
            <div id="scoreReason" class="text-indigo-200 text-sm mt-2"></div>
        </div>

        <!-- Strong Points -->
        <div class="bg-white rounded-2xl shadow p-6">
            <h2 class="text-lg font-bold text-green-600 mb-3">Strong Points</h2>
            <div id="strongPoints" class="text-gray-700 text-sm space-y-1"></div>
        </div>

        <!-- Weak Points -->
        <div class="bg-white rounded-2xl shadow p-6">
            <h2 class="text-lg font-bold text-red-500 mb-3">Weak Points</h2>
            <div id="weakPoints" class="text-gray-700 text-sm space-y-1"></div>
        </div>

        <!-- Missing Skills -->
        <div class="bg-white rounded-2xl shadow p-6">
            <h2 class="text-lg font-bold text-orange-500 mb-3">Missing Skills</h2>
            <div id="missingSkills" class="text-gray-700 text-sm space-y-1"></div>
        </div>

        <!-- What to Improve -->
        <div class="bg-white rounded-2xl shadow p-6">
            <h2 class="text-lg font-bold text-indigo-600 mb-3">What to Improve</h2>
            <div id="whatToImprove" class="text-gray-700 text-sm space-y-1"></div>
        </div>

    </div>

</div>

<script>
    async function analyzeResume() {
        const fileInput = document.getElementById('resumeFile');
        const file = fileInput.files[0];

        if (!file) {
            alert('Please select a PDF file');
            return;
        }

        const jobDescription = document.getElementById('jobDescription').value;

        if (!jobDescription.trim()) {
            alert('Please paste the job description');
            return;
        }

        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('result').classList.add('hidden');

        const formData = new FormData();
        formData.append('file', file);
        formData.append('jobDescription', jobDescription);

        try {
            const response = await fetch('http://localhost:8080/api/resume/upload', {
                method: 'POST',
                body: formData
            });

            const feedback = await response.text();
            parseFeedback(feedback);
            document.getElementById('result').classList.remove('hidden');

        } catch (error) {
            alert('Something went wrong. Please try again.');
        } finally {
            document.getElementById('loading').classList.add('hidden');
        }
    }

    function parseFeedback(text) {
        fillSection('strongPoints',  extractSection(text, 'STRONG POINTS'));
        fillSection('weakPoints',    extractSection(text, 'WEAK POINTS'));
        fillSection('missingSkills', extractSection(text, 'MISSING SKILLS'));
        fillSection('whatToImprove', extractSection(text, 'WHAT TO IMPROVE'));

        const scoreLine = extractSection(text, 'JD MATCH SCORE');
        const scoreMatch = scoreLine.match(/\d+/);
        document.getElementById('overallScore').textContent = scoreMatch ? scoreMatch[0] + '/10' : 'N/A';
        document.getElementById('scoreReason').textContent = scoreLine
                .replace(/\d+\/10/, '')
                .replace(/\d+\s*out\s*of\s*10/i, '')
                .replace('-', '')
                .trim();
    }

    function extractSection(text, heading) {
        const regex = new RegExp(heading + '[:\\s]*([\\s\\S]*?)(?=STRONG POINTS|WEAK POINTS|MISSING SKILLS|JD MATCH SCORE|WHAT TO IMPROVE|$)', 'i');
        const match = text.match(regex);
        return match ? match[1].trim() : '';
    }

    function fillSection(elementId, content) {
        const container = document.getElementById(elementId);
        container.innerHTML = '';
        const lines = content.split('\n').filter(line => line.trim() !== '');
        lines.forEach(line => {
            const p = document.createElement('p');
            p.textContent = '• ' + line.replace(/^[-*]\s*/, '').replace(/\*\*/g, '').trim();
            p.className = 'py-1 border-b border-gray-100 last:border-0';
            container.appendChild(p);
        });
    }
</script>

</body>
</html>
